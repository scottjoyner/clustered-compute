apiVersion: v1
kind: Service
metadata:
  name: compute-ray-head-svc
  namespace: compute
spec:
  type: NodePort
  selector:
    ray.io/node-type: head
  ports:
    - name: client
      port: 6379
      targetPort: 6379
      nodePort: 30379
    - name: dash
      port: 8265
      targetPort: 8265
      nodePort: 30265
